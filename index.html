<style>
  /* ==========================================================
     VARIÁVEIS DE PERSONALIZAÇÃO
     Altere as cores/tamanhos aqui para customizar todo o site.
     ========================================================== */
  :root {
    --bg-base:        #180808;   /* fundo principal (dark mode, tom vermelho) */
    --bg-gradient-1:  #180808;
    --bg-gradient-2:  #310d0d;
    --card-bg:        #220b0b;
    --card-bg-hover:  #2c1010;
    --card-border:    #3d1414;

    --accent-teal:      #14b8a6;  /* verde-petróleo, cor principal */
    --accent-teal-glow: #14b8a655;
    --accent-gold:      #f2b632;  /* dourado, cor de destaque/hover */
    --accent-gold-glow: #f2b63255;

    --text-primary:   #f5f7f6;
    --text-secondary: #9ca8a5;

    --radius-lg: 22px;
    --radius-md: 16px;
    --avatar-size: 152px;

    --font-base: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-base);
    color: var(--text-primary);
    background: radial-gradient(circle at 50% -10%, var(--bg-gradient-2) 0%, var(--bg-gradient-1) 55%);
    display: flex;
    justify-content: center;
    padding: 48px 20px 32px;
  }

  .page {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* ---------- CABEÇALHO ---------- */

  .avatar-wrap {
    width: var(--avatar-size);
    height: var(--avatar-size);
    border-radius: 50%;
    box-shadow: 0 0 0 3px var(--bg-base), 0 0 34px var(--accent-teal-glow);
  }

  .avatar {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: var(--card-bg);

    /*
      PARA TROCAR A FOTO/LOGO:
      substitua o arquivo em src="..." (pode ser um data:image/... embutido,
      como está agora, ou o caminho/URL de outra imagem).
    */
  }

  .profile-name {
    margin: 18px 0 4px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }

  .profile-name span {
    background: linear-gradient(90deg, var(--accent-teal), var(--accent-gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .profile-bio {
    margin: 0 0 32px;
    max-width: 340px;
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.5;
  }

  /* ---------- LISTA DE LINKS ---------- */

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 15.5px;
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .link-card:hover,
  .link-card:focus-visible {
    transform: translateY(-3px);
    background: var(--card-bg-hover);
    border-color: var(--accent-teal);
    box-shadow: 0 8px 24px var(--accent-teal-glow);
  }

  .link-card:active {
    transform: translateY(-1px) scale(0.99);
  }

  .link-icon {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff12;
  }

  .link-icon svg {
    width: 20px;
    height: 20px;
  }

  .link-text {
    flex: 1 1 auto;
    text-align: left;
  }

  .link-arrow {
    flex: 0 0 auto;
    opacity: 0.4;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .link-card:hover .link-arrow {
    opacity: 0.9;
    transform: translateX(3px);
  }

  /* Destaque de cor por rede (ícone) */
  .icon-whatsapp { color: #25D366; }
  .icon-instagram { color: #E1306C; }
  .icon-shop { color: var(--accent-gold); }
  .icon-x { color: #ffffff; }

  /* ---------- RODAPÉ ---------- */

  .footer {
    margin-top: 40px;
    color: var(--text-secondary);
    font-size: 12.5px;
    opacity: 0.8;
  }

  @media (max-width: 380px) {
    .page { padding-top: 8px; }
    .profile-name { font-size: 22px; }
  }
</style>
